# Example deployment for lws. Adjust image, replicas and resources to suit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lws
  labels:
    app.kubernetes.io/name: lws
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lws
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lws
      annotations:
        # For annotation-based Prometheus scraping. With the Prometheus
        # Operator, use a PodMonitor selecting the "metrics" port instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Must exceed timeouts.drain + timeouts.shutdown (5s + 15s by default).
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lws
          image: lws:latest
          env:
            # Soft memory limit for the Go GC, ~90% of limits.memory.
            - name: GOMEMLIMIT
              value: "115MiB"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: lws
  labels:
    app.kubernetes.io/name: lws
spec:
  selector:
    app.kubernetes.io/name: lws
  ports:
    - name: http
      port: 80
      targetPort: http
